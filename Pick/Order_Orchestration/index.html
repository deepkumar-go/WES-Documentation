<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Order Orchestration — butler_server</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f5f7;
      color: #172b4d;
      min-height: 100vh;
    }

    header {
      background: #0052cc;
      color: #fff;
      padding: 20px 32px;
    }
    header h1 { font-size: 1.4rem; font-weight: 700; }
    header p  { font-size: 0.85rem; opacity: 0.8; margin-top: 4px; }

    .container {
      max-width: 960px;
      margin: 32px auto;
      padding: 0 20px 48px;
    }

    .flow {
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    .step-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .step {
      width: 100%;
      border-radius: 8px;
      border: 2px solid transparent;
      background: #fff;
      cursor: pointer;
      transition: box-shadow .15s, border-color .15s;
      overflow: hidden;
    }
    .step:hover        { box-shadow: 0 2px 12px rgba(0,82,204,.15); border-color: #4c9aff; }
    .step.active       { border-color: #0052cc; box-shadow: 0 2px 16px rgba(0,82,204,.2); }

    .step-header {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      gap: 16px;
    }

    .step-num {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.9rem;
      flex-shrink: 0;
      color: #fff;
    }

    .step-title-block { flex: 1; }
    .step-title { font-weight: 600; font-size: 1rem; }
    .step-subtitle { font-size: 0.78rem; color: #6b778c; margin-top: 2px; }

    .step-chevron {
      width: 20px; height: 20px;
      flex-shrink: 0;
      transition: transform .2s;
      opacity: 0.5;
    }
    .step.active .step-chevron { transform: rotate(180deg); opacity: 1; }

    .step-summary {
      padding: 0 20px 14px 72px;
      font-size: 0.85rem;
      line-height: 1.6;
      color: #42526e;
      border-bottom: 1px solid #ebecf0;
    }
    @media (max-width: 600px) {
      .step-summary { padding-left: 20px; }
    }

    .step-detail {
      max-height: 0;
      overflow: hidden;
      transition: max-height .35s ease;
      border-top: 1px solid transparent;
    }
    .step.active .step-detail {
      max-height: 3000px;
      border-top-color: #ebecf0;
    }
    .step-detail-inner {
      padding: 20px 20px 20px 72px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    @media (max-width: 600px) {
      .step-detail-inner { grid-template-columns: 1fr; padding-left: 20px; }
    }

    .detail-card {
      background: #f4f5f7;
      border-radius: 6px;
      padding: 14px 16px;
    }
    .detail-card h4 {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: #5e6c84;
      margin-bottom: 8px;
    }
    .detail-card ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .detail-card ul li {
      font-size: 0.84rem;
      line-height: 1.45;
      padding-left: 14px;
      position: relative;
    }
    .detail-card ul li::before {
      content: "•";
      position: absolute; left: 0;
      color: #5e6c84;
    }
    .detail-card code {
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.77rem;
      background: #dfe1e6;
      padding: 1px 5px;
      border-radius: 3px;
      color: #172b4d;
    }

    .status-flow {
      grid-column: 1 / -1;
      background: #f4f5f7;
      border-radius: 6px;
      padding: 14px 16px;
    }
    .status-flow h4 {
      font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .06em; color: #5e6c84; margin-bottom: 12px;
    }
    .status-pills {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    }
    .pill {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .arrow-sep { color: #8993a4; font-size: 1rem; }

    .connector {
      width: 2px;
      height: 24px;
      background: #c1c7d0;
      position: relative;
      flex-shrink: 0;
    }
    .connector::after {
      content: "";
      position: absolute;
      bottom: -1px; left: 50%;
      transform: translateX(-50%);
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-top: 6px solid #c1c7d0;
    }

    /* per-step badge colours */
    .c1 { background: #0052cc; }
    .c2 { background: #0065ff; }
    .c3 { background: #00875a; }
    .c4 { background: #006644; }
    .c5 { background: #ff5630; }
    .c6 { background: #de350b; }
    .c7 { background: #6554c0; }
    .c8 { background: #403294; }

    /* status pill colours */
    .p-blue   { background: #deebff; color: #0747a6; }
    .p-green  { background: #e3fcef; color: #006644; }
    .p-red    { background: #ffebe6; color: #bf2600; }
    .p-yellow { background: #fffae6; color: #974f0c; }
    .p-grey   { background: #ebecf0; color: #253858; }
  </style>
</head>
<body>

<header>
  <h1>Order Orchestration Flow — butler_server</h1>
  <p>Click any step to expand details</p>
</header>

<div class="container">
  <div class="flow" id="flow"></div>
</div>

<script>
const steps = [
  {
    num: 1, color: "c1",
    title: "Order Ingestion",
    subtitle: "Orders enter via Kafka events or HTTP/gRPC APIs",
    summary: "Customer orders arrive from external systems either as real-time Kafka events or through REST/gRPC API calls. Each order is validated, stored with a <em>created</em> status, and immediately queued for scheduling. This is the entry point — nothing moves in the warehouse until an order lands here.",
    cards: [
      { heading: "Kafka Interface", items: [
        "Module: <code>pick_kafka_handler</code>",
        "Topic: <code>order-pick-updates.events</code>",

        "RA-type orders via <code>ra_order_event_handler</code>",

        "Pick instruction export via <code>pick_instruction_kafka_handler</code>"

      { heading: "On Receipt", items: [
        "Order stored as <code>order_node</code> record — status set to <code>created</code>",

        "Properties set: <code>pick_before_time</code>, <code>pick_after_time</code>, <code>bintags</code>, <code>packing_box_type</code>",

  {
    num: 2, color: "c2",
    title: "Order Manager — Scheduling Loop",
    subtitle: "Singleton gen_server that assigns orders to PPS bins",
    summary: "A central scheduler continuously evaluates the pool of pending orders and decides which order to fulfill next, and at which Pick-and-Pack Station (PPS). It prioritizes orders using configurable strategies — balancing throughput (picks per face) against urgency (orders close to their promised delivery time). Modifications and cancellations are also processed here before the order moves forward.",
    cards: [
      { heading: "Core Loop", items: [
        "Module: <code>order_manager</code> (singleton gen_server)",
        "Maintains <code>pending_orders_details</code> pool in process state",

    summary: "For every order, the system searches available inventory across storage racks to find the best combination of slots that can fulfill all items. It scores each candidate rack by factors like storage tier, travel distance to the PPS, current congestion, and how urgently the order needs to be picked. The lowest-cost combination wins and is reserved for fulfillment.",
    cards: [
      { heading: "Inventory Combination Calculation", items: [
        "Modules: <code>order_processing_functions</code> + <code>ims_cost_calculation</code>",
        "ICC: resolves which racks/slots can fulfill all order line items",

  {

    title: "Streaming Mode",
    subtitle: "High-throughput grouped order processing via order_streaming_manager",
    summary: "When multiple orders share items on the same rack, streaming mode groups them together so a single rack visit can serve several orders at once — maximizing efficiency. Orders are clustered by type (e.g. multi-shelf, single-item) and routed to the most suitable PPS. The system dynamically reshuffles groupings as racks move and new orders arrive.",
    cards: [
      { heading: "Group Types & Routing", items: [
        "Modules: <code>order_streaming_manager</code> (v2) + <code>order_streaming_manager_v1</code>",
        "Group types: MSIO, MSLO, single-item, custom",
        "Priority order: <code>streaming_grouptype_priority</code>",
        "PPS routing: <code>streaming_pps_list</code> and <code>streaming_bin_tags</code>",

  },
  {
    num: 6, color: "c6",
    title: "Pick Execution (FSMs)",

    summary: "The actual picking happens here. A front-side state machine guides the operator through each item to pick — lighting up the correct bin indicator, displaying quantities, and confirming each scan. Once all items are picked, a back-side state machine handles order clearance: printing labels, confirming the bin is ready, and releasing it for the next order.",

      ]},
      { heading: "Scan & Verification", items: [
        "Item-level scan: <code>pick_entity_scan_required</code> (disables KQ)",
        "Location scan: <code>location_scan_required</code>",
        "Container scan before breaking: <code>scan_container_for_breaking</code>",

const statusStates = [
  { label: "created",    cls: "p-blue"   },
  { arrow: "→" },
  { label: "pending",    cls: "p-blue"   },
  { arrow: "→" },
  { label: "running",    cls: "p-yellow" },
  { arrow: "→" },
  { label: "complete",   cls: "p-green"  },
  { sep: true },
  { label: "inventory_awaited",        cls: "p-yellow" },
  { sep: true },
  { label: "temporary_unfulfillable",  cls: "p-yellow" },
  { sep: true },
  { label: "unfulfillable",            cls: "p-red"    },
  { sep: true },
  { label: "abandoned",                cls: "p-red"    },
  { sep: true },
  { label: "cancelled",                cls: "p-grey"   },
];

function buildStatusFlow() {
  const wrap = document.createElement("div");
  wrap.className = "status-flow";
  const h4 = document.createElement("h4");
  h4.textContent = "Status Transitions";
  wrap.appendChild(h4);
  const pills = document.createElement("div");
  pills.className = "status-pills";
  statusStates.forEach(s => {
    const el = document.createElement("span");
    if (s.arrow) {
      el.className = "arrow-sep";
      el.textContent = s.arrow;
    } else if (s.sep) {
      el.className = "arrow-sep";
      el.textContent = "|";
    } else {
      el.className = "pill " + s.cls;
      el.textContent = s.label;
    }
    pills.appendChild(el);
  });
  wrap.appendChild(pills);
  return wrap;
}

function buildCard(card) {
  const div = document.createElement("div");
  div.className = "detail-card";
  const h4 = document.createElement("h4");
  h4.textContent = card.heading;
  div.appendChild(h4);
  const ul = document.createElement("ul");
  card.items.forEach(text => {
    const li = document.createElement("li");
    li.innerHTML = text;
    ul.appendChild(li);
  });
  div.appendChild(ul);
  return div;
}

function buildStep(step, isLast) {
  const wrapper = document.createElement("div");
  wrapper.className = "step-wrapper";

  const el = document.createElement("div");
  el.className = "step";
  el.setAttribute("role", "button");
  el.setAttribute("tabindex", "0");
  el.setAttribute("aria-expanded", "false");

  const header = document.createElement("div");
  header.className = "step-header";

  const num = document.createElement("div");
  num.className = "step-num " + step.color;
  num.textContent = step.num;

  const titleBlock = document.createElement("div");
  titleBlock.className = "step-title-block";
  const title = document.createElement("div");
  title.className = "step-title";
  title.textContent = step.title;
  const subtitle = document.createElement("div");
  subtitle.className = "step-subtitle";
  subtitle.textContent = step.subtitle;
  titleBlock.appendChild(title);
  titleBlock.appendChild(subtitle);

  const chevron = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  chevron.setAttribute("viewBox", "0 0 24 24");
  chevron.setAttribute("fill", "none");
  chevron.setAttribute("stroke", "currentColor");
  chevron.setAttribute("stroke-width", "2");
  chevron.setAttribute("stroke-linecap", "round");
  chevron.setAttribute("stroke-linejoin", "round");
  chevron.classList.add("step-chevron");
  const poly = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
  poly.setAttribute("points", "6 9 12 15 18 9");
  chevron.appendChild(poly);

  header.appendChild(num);
  header.appendChild(titleBlock);
  header.appendChild(chevron);
  el.appendChild(header);

  const detail = document.createElement("div");
  detail.className = "step-detail";

  if (step.summary) {
    const summary = document.createElement("div");
    summary.className = "step-summary";
    summary.innerHTML = step.summary;
    detail.appendChild(summary);
  }

  const inner = document.createElement("div");
  inner.className = "step-detail-inner";

  step.cards.forEach(card => inner.appendChild(buildCard(card)));
  if (step.statusFlow) inner.appendChild(buildStatusFlow());

  detail.appendChild(inner);
  el.appendChild(detail);

  el.addEventListener("click", () => {
    const isActive = el.classList.contains("active");
    document.querySelectorAll(".step.active").forEach(s => {
      s.classList.remove("active");
      s.setAttribute("aria-expanded", "false");
    });
    if (!isActive) {
      el.classList.add("active");
      el.setAttribute("aria-expanded", "true");
    }
  });
  el.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); el.click(); }
  });

  wrapper.appendChild(el);

  if (!isLast) {
    const conn = document.createElement("div");
    conn.className = "connector";
    wrapper.appendChild(conn);
  }

  return wrapper;
}

const flow = document.getElementById("flow");
steps.forEach((step, i) => flow.appendChild(buildStep(step, i === steps.length - 1)));
</script>
</body>
</html>
