<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pick Module — Config Reference</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #0A0F17;
  --surface:  #111825;
  --surface2: #18222E;
  --border:   #1D2B3A;
  --border2:  #243344;
  --text:     #D4DCE8;
  --muted:    #7E8FA3;
  --dim:      #4A5A6E;
  --accent:   #3C82C8;
  --key:      #6AABEC;
  --key-bg:   #0D1E30;
  --badge-g:  #1A3A2A;
  --badge-g-t:#4CAF81;
  --badge-p:  #1A2A3A;
  --badge-p-t:#6AABEC;
  --hl:       rgba(108,171,236,0.15);
  --sidebar-w: 240px;
  --top-h:    56px;
}

html { font-size: 14px; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, sans-serif;
  line-height: 1.5;
  min-height: 100vh;
}

/* ── Top bar ──────────────────────────────────────────── */
#topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: var(--top-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 16px;
  padding: 0 20px;
}
#topbar-title {
  display: flex; flex-direction: column; gap: 1px; flex-shrink: 0;
}
#topbar-title strong {
  font-size: 13px; font-weight: 600; color: var(--text); letter-spacing: .02em;
}
#topbar-title span {
  font-size: 11px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase;
}
#search-wrap {
  flex: 1; max-width: 420px; position: relative;
}
#search-wrap svg {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  width: 14px; height: 14px; color: var(--dim); pointer-events: none;
}
#q {
  width: 100%; padding: 7px 12px 7px 32px;
  background: var(--bg); border: 1px solid var(--border2);
  border-radius: 6px; color: var(--text); font-size: 13px;
  font-family: inherit; outline: none; transition: border-color .15s;
}
#q:focus { border-color: var(--accent); }
#q::placeholder { color: var(--dim); }
#match-count {
  font-size: 12px; color: var(--muted); margin-left: auto; white-space: nowrap;
}

/* ── Layout shell ─────────────────────────────────────── */
#shell {
  display: flex;
  padding-top: var(--top-h);
  min-height: 100vh;
}

/* ── Sidebar ──────────────────────────────────────────── */
#sidebar {
  position: fixed; top: var(--top-h); left: 0; bottom: 0;
  width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 16px 0;
  scrollbar-width: thin;
  scrollbar-color: var(--border2) transparent;
}
#sidebar-head {
  padding: 0 16px 12px;
  font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--dim); font-weight: 600;
}
.nav-item {
  display: flex; align-items: baseline; gap: 6px;
  padding: 5px 16px; cursor: pointer;
  border-left: 2px solid transparent;
  transition: background .1s, border-color .1s;
  text-decoration: none;
}
.nav-item:hover { background: var(--surface2); }
.nav-item.active {
  border-left-color: var(--accent);
  background: var(--surface2);
}
.nav-label {
  font-size: 12px; color: var(--muted); flex: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.nav-item.active .nav-label { color: var(--text); }
.nav-cnt {
  font-size: 10px; color: var(--dim);
  font-variant-numeric: tabular-nums;
}
.nav-scope {
  font-size: 9px; letter-spacing: .06em; text-transform: uppercase;
  padding: 1px 5px; border-radius: 3px;
  flex-shrink: 0;
}
.nav-scope.g { background: var(--badge-g); color: var(--badge-g-t); }
.nav-scope.p { background: var(--badge-p); color: var(--badge-p-t); }

/* ── Main content ─────────────────────────────────────── */
#main {
  margin-left: var(--sidebar-w);
  flex: 1;
  padding: 28px 32px 60px;
  min-width: 0;
}

/* ── Group sections ───────────────────────────────────── */
.group-section {
  margin-bottom: 40px;
  scroll-margin-top: calc(var(--top-h) + 20px);
}
.group-header {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.group-name {
  font-size: 14px; font-weight: 600; color: var(--text);
  letter-spacing: .01em;
}
.scope-badge {
  font-size: 10px; letter-spacing: .07em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 4px; font-weight: 500;
}
.scope-badge.global { background: var(--badge-g); color: var(--badge-g-t); }
.scope-badge.per-pps { background: var(--badge-p); color: var(--badge-p-t); }
.group-kcount {
  margin-left: auto; font-size: 11px; color: var(--dim);
  font-variant-numeric: tabular-nums;
}

/* ── Config table ─────────────────────────────────────── */
.cfg-table-wrap { overflow-x: auto; }
.cfg-table {
  width: 100%; border-collapse: collapse;
  font-size: 13px;
}
.cfg-table thead tr {
  background: var(--surface);
}
.cfg-table thead th {
  padding: 6px 12px; text-align: left;
  font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--dim); font-weight: 500;
  border-bottom: 1px solid var(--border);
}
.cfg-table thead th:first-child { width: 260px; }
.cfg-table tbody tr {
  border-bottom: 1px solid var(--border);
  transition: background .1s;
}
.cfg-table tbody tr:hover { background: var(--surface2); }
.cfg-table tbody tr.hidden { display: none; }
.cfg-table tbody tr.hl-row { background: var(--hl); }
.cfg-table td {
  padding: 8px 12px; vertical-align: top;
}
.key-cell {
  font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", ui-monospace, monospace;
  font-size: 11.5px; color: var(--key);
  background: var(--key-bg);
  white-space: nowrap;
  border-right: 1px solid var(--border);
}
mark {
  background: rgba(108,171,236,0.3);
  color: var(--text);
  border-radius: 2px;
  padding: 0 1px;
}
.desc-cell { color: var(--muted); line-height: 1.55; }

/* ── Empty state ──────────────────────────────────────── */
#empty-state {
  display: none; text-align: center; padding: 60px 20px;
  color: var(--dim); font-size: 14px;
}

/* ── Scrollbar ────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* ── Responsive ───────────────────────────────────────── */
@media (max-width: 720px) {
  :root { --sidebar-w: 0px; }
  #sidebar { display: none; }
  #main { padding: 16px; }
  .cfg-table thead th:first-child { width: 180px; }
}
</style>
</head>
<body>

<div id="topbar">
  <div id="topbar-title">
    <strong>Pick Module — Config Reference</strong>
    <span>Butler Server · apps/pick</span>
  </div>
  <div id="search-wrap">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="6.5" cy="6.5" r="4.5"/><path d="M10.5 10.5L14 14"/>
    </svg>
    <input id="q" type="search" placeholder="Search keys or descriptions…" autocomplete="off" spellcheck="false">
  </div>
  <span id="match-count"></span>
</div>

<div id="shell">
  <nav id="sidebar">
    <div id="sidebar-head">Groups</div>
    <div id="nav-list"></div>
  </nav>
  <main id="main">
    <div id="group-container"></div>
    <div id="empty-state">No matching config keys.</div>
  </main>
</div>

<script>
const GROUPS = [
  { id:'g1', label:'Scheduling & Order Processing', scope:'global', keys:[
    {k:'auto_order_processing_interval',d:'Interval in seconds between automatic order processing cycles; controls how frequently the order manager triggers periodic processing (default: 30s).'},
    {k:'order_sla',d:'Default SLA in seconds added to order creation time when no explicit PBT is set, computing a synthetic pick-by deadline.'},
    {k:'pbt_waving_window',d:'Rounding window in seconds for grouping orders with an explicit PBT into wave buckets (default: 1s).'},

    {k:'pbt_offset_in_seconds',d:'Seconds subtracted from a computed PBT to create an effective earlier deadline.'},
    {k:'pbt_system_time_buffer',d:'Safety buffer in seconds subtracted from time-remaining-to-PBT before the system treats an order as breached (default: 900s).'},
    {k:'pbt_to_consider_piggyback_ppf_in_hrs',d:'Horizon in hours within which an order can piggyback onto an existing PPF task, reducing redundant rack trips (default: 48 hrs).'},
    {k:'hours_considered_for_rob_calc',d:'Lookback window in hours for calculating Rate-of-Business (ROB) metrics (default: 48 hrs).'},
    {k:'max_threshold_for_rob',d:'Maximum ROB percentage threshold before the pick scheduler reduces rack utilization (default: 75%).'},
    {k:'prioritize_orders_post_breach',d:'When true, orders that already breached PBT are elevated to the highest processing priority.'},
    {k:'prioritize_large_orders',d:'When true, large orders (many lines) are scheduled ahead of regular orders to avoid starvation.'},
    {k:'threshold_for_large_order_processing',d:'Minimum order-line count to qualify as "large" for the prioritization strategy (default: 5).'},
    {k:'hours_to_be_considered_for_large_strategy',d:'Lookahead horizon in hours for building the large-order candidate pool.'},
    {k:'sku_c_strategy_order_percent_cutoff',d:'Percentage of worst-scoring orders extracted as the SKU-C strategy candidate set (default: 10%).'},
    {k:'find_best_cost_orders_depth',d:'Number of rack/task combinations explored when searching for the lowest-cost assignment (default: 2).'},
    {k:'min_num_order_to_pool',d:'Minimum orders that must be pooled before the prioritizer releases a batch (default: 20).'},
    {k:'is_prioritize_required',d:'Master flag enabling/disabling the order prioritization step in the streaming manager.'},
    {k:'safe_mode_for_order_manager',d:'When true, order manager runs conservatively, skipping risky paths during degraded conditions.'},
    {k:'order_auto_release',d:'Default auto-release flag applied to new orders when WMS does not supply an explicit value.'},
    {k:'multiplier_to_order_release',d:'Applied to active-user count to compute target pool size before releasing more orders (default: 2).'},
    {k:'single_multi_orders_prioritize_strategy',d:'Controls how single-bin vs multi-bin orders compete for the same PPS.'},
    {k:'simple_to_order_priority',d:'Map of flow name to priority value for converting simple-group orders to order priority.'},
    {k:'strategies_using_age_priority',d:'List of strategy atoms (e.g., critical, sku_c) for which order age is used as tiebreaker.'},
    {k:'order_sequencing_activated',d:'When true, enforces sequential order-line processing based on TPID tasking order.'},
    {k:'is_pps_task_priority_fifo',d:'When true, overrides cost-based task prioritization with strict FIFO ordering at PPS.'},
    {k:'ppf_early_order_optimization',d:'Applies additional filtering to select orders fulfillable earlier given current PPF conditions.'},
    {k:'switching_tor_to_ppf_enabled',d:'Allows automatic switching from TOR to PPF mode when TOR is within configured tolerance.'},
    {k:'include_pbt_in_fifo_bin_group_algo',d:'When true, adds a PBT-derived cost to the FIFO bin-group algorithm so urgent orders are promoted.'},
    {k:'order_proc_idc_aplus_multiplier',d:'IDC multiplier applied to Tier A+ rack assignments; tunes how strongly A+ proximity is rewarded.'},
    {k:'order_proc_idc_multiplier',d:'Global IDC multiplier scaling the distance cost component in order processing (default: 0.1).'},
    {k:'process_cutoff_multiplier',d:'Applied to active PPS count to compute the free-location threshold for longer loop timeouts.'},
    {k:'order_processing_cost_limit',d:'Upper bound on computed processing cost; orders exceeding this limit are skipped.'},
    {k:'order_processing_min_loop_timeout',d:'Minimum loop timeout in ms when free pick locations exceed the cutoff (default: 300000 ms).'},
    {k:'order_processing_cores',d:'Number of CPU cores allocated to parallel order processing computations (default: 1).'},
    {k:'order_processing_comb_tree_pruning',d:'Enables pruning of the rack combination tree to limit combinatorial explosion (default: false).'},
    {k:'order_processing_comb_tree_pruning_limit',d:'Max nodes allowed in the combination tree before pruning kicks in (default: 2500).'},
    {k:'max_orders_per_bin',d:'Max orders committed to a single PPS bin per cycle, preventing overloading (default: 20).'},
    {k:'max_qty_per_pick_cycle',d:'Max item quantity per single RMS pick cycle (default: 2).'},
    {k:'grouped_orders_clean_up_duration',d:'Age in days after which grouped order records are eligible for cleanup (default: 90 days).'},
    {k:'simple_group_permissible_change',d:'Maximum fractional volume difference allowed between items forming a simple group (default: 15%).'},
    {k:'priority_sequence_range',d:'Defines valid min/max numeric range for order priority sequence values.'},
    {k:'resolve_tpid',d:'Master flag enabling/disabling TPID (Tracking Point ID) resolution for items.'},
    {k:'tpid_resolver_cores',d:'Number of parallel workers used by the TPID resolver (default: 1).'},
    {k:'skip_resolve_tpids_at_start',d:'When true, skips the full TPID resolution pass at system startup for faster boot.'},
    {k:'maximum_commit_count_for_order',d:'Max times an order can be committed before it is filtered out as having breached the commit limit (default: 20).'},
    {k:'order_priority_critical_tag',d:'Tag value (default "critical") that identifies an order as critical priority; used in order modification and order node model.'},
    {k:'task_prioritization_algo',d:'Atom selecting the algorithm for rack transport and IMS task priority costs; determines which cost calculation strategy is dispatched.'},
    {k:'time_reference_tuple_for_task_cost',d:'Time-of-day tuple {H,M,S} used as the daily reference time when computing FIFO-based task cost (default: {0,0,0}).'},
    {k:'toggle_task_cost_on_order_size',d:'When true, dynamically adjusts pick transport split priority based on order size by toggling pps_task_priority_prioritize_low_splits.'},
    {k:'tor_deviation_bucket_size',d:'Bucket size (float, default 1.0) used when filtering orders by TOR deviation in the bin planner.'},
    {k:'station_deviation_penalty',d:'Large penalty applied during order-to-PPS assignment when TPQ-based station deviation exceeds the configured threshold (default: 1e11).'},
    {k:'station_deviation_threshold',d:'Threshold for acceptable TPQ-based deviation between an order\'s ideal station and a candidate PPS (default: 2.0).'},
    {k:'task_count_breach_penalty',d:'Large penalty applied to an aisle\'s transport cost when its task count exceeds the configured aisle task threshold (default: 1e13).'},
    {k:'pps_task_priority_consider_pbt_breach',d:'When true (default), PBT breach is factored into PPS task priority cost calculations, elevating orders approaching their deadline.'},
    {k:'pps_task_priority_msio_preference_cost',d:'Cost bonus added when routing tasks to a PPS that already has MSIO orders, encouraging MSIO consolidation at one station (default: 10000).'},
    {k:'ppstask_cost_increment_on_pps_close',d:'Cost increment applied to PPS task priority when the PPS is in a closing state, deprioritizing racks assigned to a closing station.'},
  ]},
  { id:'g2', label:'Inventory & UOM Fulfillment', scope:'global', keys:[
    {k:'enable_inventory_count_check',d:'Enables periodic inventory count verification at rack slots during picking.'},
    {k:'inventory_count_check_limit',d:'Max count-check failures tolerated for a slot before escalation (default: 5).'},
    {k:'max_combinations_per_orderline',d:'Max rack/slot combinations evaluated per order line during selection (default: 50).'},

    {k:'merge_same_item_and_uom',d:'When true, merges order lines for identical SKU+UOM before generating pick instructions.'},
    {k:'strict_uom_pick_enabled',d:'Enforces exact UOM matching; prevents substitution even if alternative UOM is available.'},
    {k:'uom_container_breakable',d:'Map of container type to boolean; indicates whether containers can be broken for partial UOM picks.'},
    {k:'break_inners',d:'When true, inner packs may be broken to fulfill fractional quantities (default: true).'},

    {k:'uid_details_cache_lifetime_ms',d:'TTL in ms for PPS client UID detail cache before entries expire (default: 24 hours).'},
    {k:'retry_inventory_txn_data_delay_sec',d:'Retry wait in ms before re-checking a kitted inventory transaction after failure (default: 2000 ms).'},
    {k:'pending_inventory_pbt_breach_buffer',d:'Buffer in seconds before actual PBT breach when pending-inventory orders are treated as breached.'},
    {k:'sideline_pending_inventory_orders',d:'When true, orders awaiting inventory are moved out of the active queue, freeing capacity.'},
    {k:'enable_audit_for_inventory_inside_container',d:'Enables audit scanning for inventory inside tote containers at PPS.'},
    {k:'audit_on_short_pick',d:'Triggers an inventory audit flow immediately when a short pick is detected.'},
    {k:'partial_pick_allowed',d:'When true, orders can be partially fulfilled and dispatched even if not all lines are picked.'},
  ]},
  { id:'g3', label:'Rack Selection & IDC Cost', scope:'global', keys:[
    {k:'rack_selection_strategy',d:'Strategy for choosing among equally-scored rack combinations: random, min, or max.'},
    {k:'rack_selector_batch_size',d:'Rack combinations evaluated per batch during incremental selection (default: 100).'},
    {k:'rack_selector_max_workers',d:'Max parallel worker processes the rack selector spawns (default: 3).'},
    {k:'rack_selector_recalc_cooldown_ms',d:'Minimum cooldown in ms between recalculation cycles to prevent thrashing (default: 2000 ms).'},
    {k:'rack_tier_weights',d:'Map of tier label to numeric weight; higher weight = more attractive rack tier.'},
    {k:'rack_tier_score_mode',d:'Aggregation mode (mean/min/max) for combining per-rack tier scores (default: mean).'},

    {k:'racks_considered_percentage',d:'Percentage of the sorted rack list included in the rack order-line count cache (default: 100%).'},

    {k:'rack_count_threshold_to_run_tpq',d:'Minimum racks with assigned order lines before TPQ (Task Pool Quality) calculation is triggered (default: 8).'},

    {k:'rack_penalty_allowed_pps_hops',d:'PPS-to-PPS hops allowed before a rack incurs a hopping penalty (default: 0).'},

    {k:'remove_blocked_racks_cron_ms',d:'Interval in ms between cron runs that clear blocked rack entries from the selector cache.'},
    {k:'idc_cost_unassigned_entity',d:'IDC cost for a rack with no assigned transport path; effectively excludes it from selection (default: 1e13).'},
    {k:'idc_max_expected_range',d:'Max IDC range used to normalize range scores to [0,1]; values above are clamped (default: 200).'},

    {k:'unassigned_tote_idc_limit',d:'IDC cost cap for TSU racks not assigned to any tote; used as sentinel for deprioritization (default: 10000).'},

    {k:'max_allowed_idc_for_hopping',d:'Maximum inter-PPS IDC allowed when considering PPS hopping; filters candidate stations to those within this distance (default: 20).'},
    {k:'max_allowed_tasks_per_pps',d:'Max transport job racks allowed per PPS station (default: no_limit); stations exceeding this are filtered as overloaded.'},
    {k:'exclude_rack_types_for_empty_tote_removal',d:'List of rack types excluded from the empty tote removal flow; racks of these types are ineligible (default: []).'},

  { id:'g4', label:'Bin Planning & Packing', scope:'global', keys:[

    {k:'bin_filtering_logic_threshold_in_min',d:'Minutes since last wasted cycle before single-bin filtering is re-applied (default: 10 min).'},

    {k:'print_while_bin_clear',d:'When true in two-stage flows, bin labels are printed while the bin is being cleared.'},
    {k:'invoice_needed',d:'Default invoice flag for new orders when WMS does not supply an explicit value.'},
    {k:'packing_box_label',d:'Display label shown to operator on PPS GUI for packing box LPN re-validation (default: "Packing Box").'},

    {k:'irt_scan_enabled',d:'Enables IRT (Item Return Tracking) scanning; FSM waits for an IRT barcode scan during checklist and item-pick states.'},
    {k:'validation_key',d:'Validation keys passed to platform_utils:validate_data_capture for tote or packing box external validation.'},
    {k:'enable_single_pptl_press_for_front_bin_clear',d:'When true, a single PPTL press is sufficient to clear a front bin.'},
    {k:'skip_pptl_press',d:'When true, the PPTL press step is bypassed and the system auto-fires the bin-process event.'},
    {k:'max_msiob_order_count',d:'Max MSIO-B orders allowed per bin before no further orders are added (default: unlimited).'},
    {k:'max_msiob_orders_in_physical_bin',d:'Max MSIO-B orders that can physically share one bin (default: 5).'},
    {k:'min_msiob_order_count',d:'Min MSIO-B orders required before a bin becomes eligible for certain operations.'},
    {k:'merge_msio_orders_with_diff_bin_tag',d:'When true, MSIO orders with different bin tags may be merged into the same physical bin.'},
    {k:'msio_bin_full_default_zero',d:'When true, the default operator-shown quantity for an MSIO bin-full exception is 0 (prompting recount).'},
    {k:'mru_flow',d:'Enables MRU (Mobile Rack Unit) docking flow at this PPS, affecting cost calculation and cleanup operations.'},
    {k:'mtu_flow',d:'Enables MTU (Mobile Transfer Unit) flow at this PPS; influences cost calculation and auto-undocking.'},
    {k:'auto_undock_mru',d:'Enables automatic MRU undocking after pick completion.'},
    {k:'auto_undock_mtu',d:'Enables automatic MTU undocking after pick completion (takes precedence over MRU for interval).'},
    {k:'release_rack_on_last_scan',d:'When true, the rack is released to the system immediately after the operator\'s last scan.'},
    {k:'uph_active',d:'When true, activates UPH (Units Per Hour) tracking for this PPS seat with a periodic sync timer.'},
    {k:'uph_refresh_interval',d:'Interval in seconds for UPH metric refresh when uph_active is true (default: 60s).'},
    {k:'enable_uom_count_suggestion',d:'When true, fetches UOM details from MDM to suggest unit-of-measure counts to the operator.'},
    {k:'heavy_mass_threshold',d:'Mass threshold in kg above which an item is flagged as heavy to the operator (default: 25 kg).'},
    {k:'show_bin_view',d:'When true (default), shows the graphical bin-view panel to the operator at the pick front.'},
    {k:'show_pick_grafana_dashboards',d:'When true, Grafana dashboard links are included in pick-front GUI responses.'},
    {k:'enable_agent_error_popup',d:'When true, shows a popup when an agent error occurs (unless reason is pps_close).'},
    {k:'is_error_popup_disabled',d:'Map keyed by FSM role (pick_front, pick_back) controlling whether error popups are suppressed.'},
    {k:'inventory_carrier_skip_timer_ms',d:'Timeout in ms (default: 6000) after which an inventory carrier is skipped if no action has been taken.'},
    {k:'order_carrier_skip_timer_ms',d:'Timeout in ms (default: 30000) after which an order-level carrier is skipped if not processed.'},
    {k:'auto_sideline_pick',d:'When true, crashed or unrecoverable picks are automatically sidelined without operator intervention.'},
    {k:'auto_skip_alert_duration',d:'Seconds after which the auto-skip GUI alert is automatically dismissed.'},
    {k:'carrier_change_exception_enabled',d:'When true (non-dockable, single bin group per seat), the carrier-change exception button (PkF015) is shown.'},
    {k:'ttp_conveyor_flow',d:'Enables TTP (Tote-To-Position) conveyor flow where bins are cleared via conveyor rather than manual removal.'},
    {k:'pick_carrier_for_ttp',d:'In TTP conveyor flow, when true, the working table state is set to a carrier-level screen when no PPS bin is active.'},
    {k:'master_pptl_enabled',d:'Enables master PPTL mode where a single press drives quantity updates across all bins (used in TTP/conveyor flows).'},
    {k:'order_clearing_side',d:'Defines which side (front or back, default back) orders are cleared from.'},
    {k:'order_rc_mapping_behaviour',d:'How orders are matched to rollcages: dynamic (flexible) or any (any available bin).'},
    {k:'excluded_pptl_color_actions',d:'List of PPTL color actions overridden to blue glow for this station.'},
    {k:'inventory_notification_propagation_config',d:'Map defining which item attributes and operators are used to propagate inventory notifications during pick events.'},
    {k:'container_put_confirmation',d:'When true (with ≤1 order detail), requires operator confirmation before putting the item into the container.'},
    {k:'shuttle_induct_point_recheck_threshold',d:'Seconds (default: 3) after which induct points for shuttle PPS are rechecked and updated.'},
    {k:'archive_order_on_bin_clear',d:'Controls whether completed orders are hard-archived when a bin is cleared (default: true).'},
    {k:'rack_penalty_order_overload_threshold',d:'Open-order count (default: 12) above which a large rack penalty is applied to discourage further assignment to an overloaded PPS.'},
  ]},
];

// Build total counts
const totalKeys = GROUPS.reduce((s,g) => s + g.keys.length, 0);

// ── Build nav ───────────────────────────────────────────
const navList = document.getElementById('nav-list');
GROUPS.forEach(g => {
  const a = document.createElement('a');
  a.className = 'nav-item';
  a.href = '#' + g.id;
  a.innerHTML = `<span class="nav-scope ${g.scope === 'per-pps' ? 'p' : 'g'}">${g.scope === 'per-pps' ? 'pps' : 'gl'}</span><span class="nav-label">${g.label.replace(/^\d+\.\s*/,'')}</span><span class="nav-cnt">${g.keys.length}</span>`;
  navList.appendChild(a);
});

// ── Build sections ──────────────────────────────────────
const container = document.getElementById('group-container');
GROUPS.forEach(g => {
  const sec = document.createElement('section');
  sec.className = 'group-section';
  sec.id = g.id;

  const rows = g.keys.map((e,i) =>
    `<tr data-key="${e.k}" data-desc="${e.d.toLowerCase()}">
      <td class="key-cell">${e.k}</td>
      <td class="desc-cell">${e.d}</td>
    </tr>`
  ).join('');

  sec.innerHTML = `
    <div class="group-header">
      <span class="group-name">${g.label}</span>
      <span class="scope-badge ${g.scope}">${g.scope}</span>
      <span class="group-kcount" id="cnt-${g.id}">${g.keys.length} keys</span>
    </div>
    <div class="cfg-table-wrap">
      <table class="cfg-table">
        <thead><tr><th>Config Key</th><th>Description</th></tr></thead>
        <tbody id="tbody-${g.id}">${rows}</tbody>
      </table>
    </div>`;
  container.appendChild(sec);
});

// Update match count display
document.getElementById('match-count').textContent = `${totalKeys} keys · 15 groups`;

// ── Search ──────────────────────────────────────────────
function esc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function highlight(text, re) {
  return re ? text.replace(re, m => `<mark>${m}</mark>`) : text;
}

let searchTimer;
document.getElementById('q').addEventListener('input', function() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => doSearch(this.value.trim()), 80);
});

function doSearch(q) {
  const re = q ? new RegExp(esc(q), 'gi') : null;
  let total = 0;
  let visibleGroups = 0;

  GROUPS.forEach(g => {
    const tbody = document.getElementById('tbody-' + g.id);
    const sec = document.getElementById(g.id);
    const cnt = document.getElementById('cnt-' + g.id);
    let visible = 0;

    Array.from(tbody.rows).forEach(row => {
      const key = row.dataset.key;
      const desc = row.dataset.desc;
      const match = !q || key.includes(q.toLowerCase()) || desc.includes(q.toLowerCase());
      row.classList.toggle('hidden', !match);
      if (match) {
        visible++;
        // Update highlighted content
        const keyCell = row.cells[0];
        const descCell = row.cells[1];
        // Find original data from GROUPS
        const orig = g.keys.find(e => e.k === key);
        if (orig) {
          keyCell.innerHTML = highlight(orig.k, re);
          descCell.innerHTML = highlight(orig.d, re);
        }
      }
    });

    const hidden = !visible;
    sec.style.display = hidden ? 'none' : '';
    cnt.textContent = q ? `${visible} / ${g.keys.length} keys` : `${g.keys.length} keys`;
    total += visible;
    if (!hidden) visibleGroups++;
  });

  const empty = document.getElementById('empty-state');
  empty.style.display = total === 0 ? 'block' : 'none';
  document.getElementById('match-count').textContent = q
    ? `${total} of ${totalKeys} keys`
    : `${totalKeys} keys · 15 groups`;
}

// ── Active nav highlight on scroll ─────────────────────
const sections = GROUPS.map(g => document.getElementById(g.id));
const navItems = Array.from(document.querySelectorAll('.nav-item'));
const topH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--top-h')) || 56;

const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      navItems.forEach(n => n.classList.remove('active'));
      const match = navItems.find(n => n.getAttribute('href') === '#' + entry.target.id);
      if (match) {
        match.classList.add('active');
        match.scrollIntoView({block:'nearest'});
      }
    }
  });
}, { rootMargin: `-${topH}px 0px -60% 0px`, threshold: 0 });

sections.forEach(s => { if (s) observer.observe(s); });
</script>
</body>
